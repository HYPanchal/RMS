<div class="page">
  <div class="page-header mb-4 animation">
    <h3 class="fw-bold mb-1">Billing</h3>
    <p class="text-muted mb-0 small">Generate and track rent bills across your properties</p>
  </div>

  <div class="billing-tabs mb-4 animation" style="animation-delay: 100ms;">
    <button class="tab-btn" [class.active]="activeTab() === 'pending'" (click)="setTab('pending')">
      Pending
    </button>
    <button class="tab-btn" [class.active]="activeTab() === 'generated'" (click)="setTab('generated')">
      Generated
    </button>
  </div>

  @if (activeTab() === 'pending') {
    <app-billing-pending />
  } @else {
    <app-billing-generated />
  }
</div>
