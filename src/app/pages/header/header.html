    <nav class="navbar navbar-expand-lg custom-navbar sticky-top">
        <div class="container-fluid px-3 px-md-4">

                <span class="brand-logo">

                        <path d="M4 21V9.5L12 4L20 9.5V21H14V15H10V21H4Z" stroke="white" stroke-width="1.6"
